<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EduFísica Pro · Banco de actividades</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#fff}.header{background:linear-gradient(135deg,#059669,#0891b2);padding:20px;position:sticky;top:0;z-index:10}.header h1{margin:0 0 4px;font-size:1.35rem}.header small{color:#d1fae5}.back{display:inline-block;color:#d1fae5;text-decoration:none;margin-bottom:6px}.container{max-width:1000px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:14px}.input,.select{width:100%;padding:12px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.3rem;color:#34d399}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px}.card h3{margin:0 0 8px;font-size:1rem}.meta{font-size:.78rem;color:#94a3b8;margin-bottom:8px}.tag{display:inline-block;padding:4px 8px;margin:2px 4px 2px 0;border-radius:999px;background:#334155;font-size:.72rem}.btn{border:0;border-radius:9px;padding:9px 11px;background:#059669;color:#fff;cursor:pointer}.btn.secondary{background:#334155}.actions{display:flex;gap:7px;margin-top:10px}.empty{padding:40px;text-align:center;color:#94a3b8}.session-panel{position:fixed;right:14px;bottom:14px;background:#0b1220;border:1px solid #334155;border-radius:14px;padding:12px;width:min(360px,calc(100vw - 28px));box-shadow:0 15px 40px rgba(0,0,0,.35)}.session-panel h4{margin:0 0 8px}.session-item{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #1e293b;font-size:.85rem}.print-btn{width:100%;margin-top:10px}.loading{padding:40px;text-align:center;color:#94a3b8}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.session-panel{position:static;width:auto;margin:16px}.stats{grid-template-columns:repeat(3,1fr)}}@media print{body{background:#fff;color:#000}.header,.toolbar,.stats,.grid,.back{display:none}.session-panel{position:static;border:0;box-shadow:none;width:100%;color:#000;background:#fff}.session-panel .btn{display:none}.session-item{border-color:#ccc;color:#000}}
</style></head>
<body>
<div class="header"><a class="back" href="index.html">← Volver a EduFísica Pro</a><h1>📚 Banco de actividades</h1><small>Busca, filtra y construye tus propias sesiones</small></div>
<main class="container"><div class="toolbar"><input id="q" class="input" placeholder="Buscar por nombre, material, edad..." oninput="render()"><select id="tipo" class="select" onchange="render()"><option value="">Todos los tipos</option></select><select id="eval" class="select" onchange="render()"><option value="">Evaluación: todas</option><option value="Opcional">Evaluables opcionalmente</option></select></div><div class="stats"><div class="stat"><strong id="nTotal">0</strong>Actividades</div><div class="stat"><strong id="nVisibles">0</strong>Resultados</div><div class="stat"><strong id="nSesion">0</strong>En sesión</div></div><div id="grid" class="grid"><div class="loading">Cargando banco...</div></div></main>
<aside class="session-panel"><h4>🧩 Mi sesión</h4><div id="sessionList"><small style="color:#94a3b8">Añade actividades desde el banco.</small></div><button class="btn print-btn" onclick="window.print()">🖨️ Imprimir sesión</button></aside>
<script>
let ACTIVIDADES=[];let session=JSON.parse(localStorage.getItem('edufisica_session_builder')||'[]');
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
async function init(){try{const r=await fetch('data/actividades-cooperacion.json');if(!r.ok)throw new Error('No se pudo cargar el banco');ACTIVIDADES=await r.json();const tipos=[...new Set(ACTIVIDADES.map(a=>a.tipo).filter(Boolean))].sort();document.getElementById('tipo').innerHTML='<option value="">Todos los tipos</option>'+tipos.map(t=>`<option>${esc(t)}</option>`).join('');render();}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Error al cargar las actividades.</div>';console.error(e);}}
function filtered(){const q=document.getElementById('q').value.toLowerCase().trim(),tipo=document.getElementById('tipo').value,ev=document.getElementById('eval').value;return ACTIVIDADES.filter(a=>(!tipo||a.tipo===tipo)&&(!ev||a.evaluable===ev)&&(!q||[a.nombre,a.material,a.edadOriginal,a.codigo,a.categoria].join(' ').toLowerCase().includes(q)));}
function addToSession(id){if(!session.includes(id)){session.push(id);localStorage.setItem('edufisica_session_builder',JSON.stringify(session));render();}}
function removeFromSession(id){session=session.filter(x=>x!==id);localStorage.setItem('edufisica_session_builder',JSON.stringify(session));render();}
function renderSession(){const items=session.map(id=>ACTIVIDADES.find(a=>a.id===id)).filter(Boolean);document.getElementById('nSesion').textContent=items.length;document.getElementById('sessionList').innerHTML=items.length?items.map(a=>`<div class="session-item"><span>${esc(a.nombre)} <small style="color:#94a3b8">${esc(a.duracion||'')}</small></span><button class="btn secondary" onclick="removeFromSession('${a.id}')">✕</button></div>`).join(''):'<small style="color:#94a3b8">Añade actividades desde el banco.</small>';}
function render(){const list=filtered();document.getElementById('nTotal').textContent=ACTIVIDADES.length;document.getElementById('nVisibles').textContent=list.length;document.getElementById('grid').innerHTML=list.length?list.map(a=>`<article class="card"><h3>${esc(a.nombre)}</h3><div class="meta">${esc(a.codigo)} · ${esc(a.tipo)}${a.duracion?' · '+esc(a.duracion):''}</div><span class="tag">${esc(a.categoria||'Actividad')}</span>${a.edadOriginal?`<span class="tag">${esc(a.edadOriginal)}</span>`:''}<p><strong>Material:</strong> ${esc(a.material||'Pendiente de completar')}</p><p style="color:#34d399;font-size:.82rem">✓ Evaluación ${esc(a.evaluable||'Pendiente')}</p><div class="actions"><button class="btn" onclick="addToSession('${a.id}')">+ Añadir a sesión</button></div></article>`).join(''):'<div class="empty">No hay actividades con esos filtros.</div>';renderSession();}
init();
</script></body></html>
